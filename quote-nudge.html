<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quote Nudge | Plainwork Tools</title><style>body{font:16px system-ui;max-width:820px;margin:40px auto;padding:0 18px;color:#18201c}label{display:block;font-weight:650;margin-top:14px}input,textarea,select{width:100%;padding:10px;box-sizing:border-box}textarea{height:150px}.card{border:1px solid #ddd;border-radius:14px;padding:18px}button{background:#18201c;color:white;padding:10px 14px;border:0;border-radius:8px;margin-top:12px}</style></head><body><a href="index.html">← All tools</a><h1>Quote Nudge</h1><p>Create a polite follow-up for an estimate without sounding pushy.</p><div class="card"><label>Customer or company name<input id="customer" placeholder="Taylor"></label><label>Service or project<input id="job" placeholder="the hydraulic repair estimate"></label><label>Follow-up stage<select id="stage"><option value="1">First check-in</option><option value="2">Second follow-up</option><option value="3">Close the loop</option></select></label><button onclick="make()">Generate</button><textarea id="out"></textarea><button onclick="navigator.clipboard.writeText(out.value)">Copy</button></div><p>Review and personalize before sending. Follow applicable anti-spam and customer-contact rules.</p><script>function make(){let c=customer.value||'there',j=job.value||'the estimate',s=stage.value;out.value=s==='1'?'Hi '+c+', just checking that you received '+j+'. If you have any questions or want anything adjusted, I’m happy to help.':s==='2'?'Hi '+c+', following up once more on '+j+'. Is this still something you’re considering, or has the timing changed? Either answer is helpful.':'Hi '+c+', I’ll close the loop on '+j+' for now so I don’t keep filling your inbox. If the project comes back up, feel free to reach out and I can revisit it.'}</script></body></html>
