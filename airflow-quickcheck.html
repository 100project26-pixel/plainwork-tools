<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engine Airflow Quickcheck | Plainwork Tools</title><style>body{font:16px system-ui;max-width:820px;margin:40px auto;padding:0 18px;color:#18201c}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #ddd;border-radius:14px;padding:18px}label{font-weight:650}input{width:100%;padding:10px;box-sizing:border-box}@media(max-width:600px){.g{grid-template-columns:1fr}}</style></head><body><a href="index.html">← All tools</a><h1>NA Engine Airflow Quickcheck</h1><p>Estimate theoretical four-stroke airflow from displacement, RPM and volumetric efficiency.</p><div class="card g"><label>Displacement (cu in)<input id="cid" type="number" value="360"></label><label>RPM<input id="rpm" type="number" value="6000"></label><label>Volumetric efficiency (%)<input id="ve" type="number" value="85"></label><div><h2 id="out"></h2></div></div><p>Formula: CFM = CID × RPM × VE ÷ 3456. This is a rough naturally aspirated planning estimate, not a compressor-sizing or engine-safety calculation.</p><script>function c(){out.textContent=Math.round((+cid.value||0)*(+rpm.value||0)*(+ve.value||0)/100/3456)+' CFM estimated'}[cid,rpm,ve].forEach(x=>x.oninput=c);c()</script></body></html>
