<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 Attempts | Plainwork Tools</title><meta name="description" content="100 zero-cost micro-experiments for repair shops, fleets, contractors and field-service businesses."><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:1100px;margin:36px auto;padding:0 18px;color:#1d1d1f;line-height:1.45}a{color:inherit}.muted{color:#666}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px}.toolbar input{flex:1;min-width:240px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:12px;padding:15px;background:#fff}.card h3{margin:.2rem 0 .35rem}.badge{font-size:12px;border:1px solid #ccc;border-radius:999px;padding:3px 7px;display:inline-block}.detail{border:1px solid #ccc;border-radius:14px;padding:22px;margin:20px 0;background:#fafafa}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;padding:10px 13px;border:1px solid #777;border-radius:8px;text-decoration:none;background:white;cursor:pointer}.primary{font-weight:700}.count{font-size:14px}.hide{display:none}@media(max-width:600px){body{margin-top:22px}}</style></head><body><h1>Plainwork Tools — 100 Attempts</h1><p class="muted">A rolling $0-cost portfolio of small operational tools and templates. Each attempt targets one concrete pain point and tests whether a free starter asset can earn a useful signal or a request for a custom worksheet/workflow.</p><p><a href="index.html">← Comeback Cost Quickcheck (A-006)</a></p><div id="detail" class="detail hide"></div><div class="toolbar"><input id="q" placeholder="Search attempts, audiences or problems"><select id="aud"><option value="">All audiences</option></select><span id="count" class="count"></span></div><div id="grid" class="grid"></div><script>window.ATTEMPTS=[];</script><script src="portfolio-data-1.js"></script><script src="portfolio-data-2.js"></script><script src="portfolio-data-3.js"></script><script src="portfolio-data-4.js"></script><script src="portfolio-data-5.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function csvFor(a){const h=a.headers||[];return h.join(',')+'\n'+h.map(()=> '').join(',')+'\n'}
function download(a){const blob=new Blob([csvFor(a)],{type:'text/csv'});const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download=(a.id+'-'+a.title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'')+'.csv';x.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function mail(a){const sub=encodeURIComponent(a.id+' — '+a.title+' custom worksheet sample');const body=encodeURIComponent('Business type:\nCurrent process:\nBiggest pain point:\nWhat I want the worksheet/tool to do:\n');return 'mailto:100project26@gmail.com?subject='+sub+'&body='+body}
function show(a){location.hash=a.id;const d=document.getElementById('detail');d.classList.remove('hide');d.innerHTML=`<span class="badge">${esc(a.id)}</span><h2>${esc(a.title)}</h2><p><strong>For:</strong> ${esc(a.audience)}</p><p><strong>Problem:</strong> ${esc(a.problem)}</p><p><strong>Free starter:</strong> ${esc(a.offer)}</p><p><strong>Demand signal:</strong> ${esc(a.signal)}</p><p><strong>Starter CSV fields:</strong> ${esc((a.headers||[]).join(', '))}</p><div class="actions"><button class="btn primary" id="dl">Download starter CSV</button><a class="btn" href="${mail(a)}">Request a free custom sample</a></div><p class="muted"><small>Planning starter only. Adapt fields to your operation. No account or payment required.</small></p>`;document.getElementById('dl').onclick=()=>download(a);d.scrollIntoView({behavior:'smooth',block:'start'})}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),aud=document.getElementById('aud').value;const list=ATTEMPTS.filter(a=>(!aud||a.audience===aud)&&(!q||[a.id,a.title,a.audience,a.problem,a.offer,a.signal].join(' ').toLowerCase().includes(q)));document.getElementById('count').textContent=list.length+' / '+ATTEMPTS.length;document.getElementById('grid').innerHTML=list.map(a=>`<div class="card"><span class="badge">${esc(a.id)}</span><h3>${esc(a.title)}</h3><div class="muted">${esc(a.audience)}</div><p>${esc(a.problem)}</p><button class="btn" onclick='show(ATTEMPTS.find(x=>x.id==="${a.id}"))'>Open attempt</button></div>`).join('')}
const audiences=[...new Set(ATTEMPTS.map(a=>a.audience))].sort();document.getElementById('aud').innerHTML+=[...audiences].map(x=>`<option>${esc(x)}</option>`).join('');document.getElementById('q').oninput=render;document.getElementById('aud').onchange=render;render();const wanted=location.hash.slice(1);if(wanted){const a=ATTEMPTS.find(x=>x.id===wanted);if(a)show(a)}
</script></body></html>
